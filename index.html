
<!DOCTYPE html>
<html>

<head>
    <title>Multiple Location Map</title>

    <!-- Leaflet CSS -->
     
    <link rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css">

    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>

<body>

    <h2>Karachi Locations</h2>

    <h3>Aptech Metro Star Gate</h3>
    <iframe width="600" height="300"
        src="https://maps.google.com/maps?q=Aptech%20Metro%20Star%20Gate%20Karachi&output=embed">
    </iframe>

    <h3>Clifton Karachi</h3>
    <iframe width="600" height="300" src="https://maps.google.com/maps?q=Clifton%20Karachi&output=embed">
    </iframe>

    <h3>Karachi Airport</h3>
    <iframe width="600" height="300"
        src="https://maps.google.com/maps?q=Jinnah%20International%20Airport%20Karachi&output=embed">
    </iframe>

</body>

</html>
